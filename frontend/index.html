<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dysarthria AI - Web App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>
    
    <main class="glass-panel">
        <header>
            <div class="logo">
                <span class="icon">🎙️</span>
                <div>
                    <h1>Dysarthria AI</h1>
                    <p>Empowering Every Voice</p>
                </div>
            </div>
            <div class="status-badge" id="status-badge">Ready</div>
        </header>

        <section class="recorder-section">
            <div class="mic-container" id="mic-btn">
                <div class="pulse-ring"></div>
                <button class="mic-button">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>
            </div>
            <p class="instruction" id="instruction-text">TAP TO SPEAK</p>
        </section>

        <section class="result-section">
            <div class="transcription-box">
                <h3>Transcription</h3>
                <p id="transcription-text" class="placeholder">Your transcribed text will appear here...</p>
                <div class="waveform" id="waveform"></div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
